# 3 of 3 -- WINDOWS   action to run in an ELEVATED prompt on win11:
#                       net user demotest "Passw0rd!2026" /add
#                     then straight away:
#                       net user demotest /delete
#
# Log test line (Windows EventChannel, event 4720, account created):
#   <Event xmlns='http://schemas.microsoft.com/win/2004/08/events/event'><System><Provider Name='Microsoft-Windows-Security-Auditing' Guid='{54849625-5478-4994-a5ba-3e3b0328c30d}'/><EventID>4720</EventID><Version>0</Version><Level>0</Level><Task>13824</Task><Opcode>0</Opcode><Keywords>0x8020000000000000</Keywords><TimeCreated SystemTime='2026-10-04T15:00:00.0000000Z'/><EventRecordID>1000000000</EventRecordID><Correlation/><Execution ProcessID='1408' ThreadID='2582'/><Channel>Security</Channel><Computer>WIN11</Computer><Security/></System><EventData><Data Name='TargetUserName'>demotest</Data><Data Name='TargetDomainName'>CORP</Data><Data Name='TargetSid'>S-1-5-21-780672331-3256254420-2915116740-2970</Data><Data Name='SubjectUserSid'>S-1-5-18</Data><Data Name='SubjectUserName'>Administrator</Data><Data Name='SubjectDomainName'>CORP</Data><Data Name='SubjectLogonId'>0x369e0d</Data><Data Name='PrivilegeList'>-</Data><Data Name='SamAccountName'>svc_temp</Data></EventData></Event>
# Expect in the decoded output:
#   event.code = 4720
#   event.action = user-created      <-- CHECK: if the decoder uses another value,
#   event.category contains iam          change that one line below to match
# ----------------------------------------------------------------------------
id: b5b54334-a7ad-508d-8846-7bfc93b13dac
logsource:
  product: iam
tags:
  - attack.persistence
  - attack.t1136
  - attack.t1136.001
falsepositives:
  - Legitimate account provisioning by IT administrators
level: medium
status: stable
enabled: true
detection:
  condition: selection
  selection:
    event.action: user-created    # <-- CHECK
    event.category|contains: iam
metadata:
  title: DEMO - User account created
  author: Demo environment
  description: >
    Detects creation of a user account. Outside of normal provisioning this can
    indicate an attacker establishing persistence with a new local account.
  references:
