# =============================================================================
# DEMO detection rules -- three, one per platform.
#
# Written in the same schema as the stock rules, and matching the same way:
#   * sudo + command arguments  -> mirrors "Sudo command targeting a persistence
#     path" (event.action: sudo, process.args|contains)
#   * account activity          -> mirrors "User added to privileged group"
#     (event.category|contains: iam)
#
# Paste ONE rule at a time into Security Analytics > Detection > Rules > Create,
# with the space selector on DRAFT. Each is a separate YAML document.
#
# I left `compliance:` out on purpose rather than invent framework mappings.
# If the editor insists on it, copy the block from the stock sudo rule.
# If it generates its own id, delete the `id:` line.
#
# v2: the two sudo rules now match process.command_line. v1 matched
# process.args, copied from a stock rule, but real sudo events from this decoder
# carry only process.command_line (process.args does not exist on them), so v1
# could never fire. Confirmed against live events, not assumed.
#
# BEFORE PROMOTING, run each rule's test line through the Wazuh Log test tool
# and confirm the decoded fields named under it. Promotion looks one-way, so a
# field that does not match means a rule that saves fine and never fires.
# =============================================================================


# ----------------------------------------------------------------------------
# 1 of 3 -- LINUX   action to run on ubuntu24:   sudo cat /etc/shadow >/dev/null
#
# Log test line (syslog):
#   Oct  4 14:35:47 sbs sudo[111]:     root : TTY=pts/1 ; PWD=/root ; USER=root ; COMMAND=/usr/bin/cat /etc/shadow
# Expect in the decoded output:
#   event.action = sudo
#   process.command_line = /usr/bin/cat /etc/shadow
# ----------------------------------------------------------------------------
id: 7dc03447-be16-5e78-b6a2-91fb24208037
logsource:
  product: process
tags:
  - attack.credential-access
  - attack.t1003
  - attack.t1003.008
falsepositives:
  - Authorised administrators or backup tooling reading the shadow file through sudo
level: high
status: stable
enabled: true
detection:
  condition: selection
  selection:
    event.action: sudo
    process.command_line|contains:
      - /etc/shadow
metadata:
  title: DEMO - Shadow file read via sudo
  author: Demo environment
  description: >
    Detects a sudo-elevated command whose arguments reference /etc/shadow, the
    file that holds local password hashes. Reading it as root is a common step
    in credential dumping.
  references:
    - https://attack.mitre.org/techniques/T1003/008/
  documentation: ''
  supports:
    - ''
  modified: '2026-10-04'
mitre:
  subtechnique:
    id:
      - T1003.008
    name:
      - /etc/passwd and /etc/shadow
  tactic:
    id:
      - TA0006
    name:
      - Credential Access
  technique:
    id:
      - T1003
    name:
      - OS Credential Dumping
---

# ----------------------------------------------------------------------------
# 2 of 3 -- macOS   action to run on the Mac VM (021):
#                   sudo security find-generic-password -ga demo-item
#                   (prints "could not be found"; no real secret is touched)
#
# Log test line (macOS unified log):
#   2026-10-04 20:05:47.220540+0530  mac.local sudo[333]:  jlee : TTY=ttys000 ; PWD=/Users/jlee ; USER=root ; COMMAND=/usr/bin/security find-generic-password -ga demo-item
# Expect in the decoded output:
#   event.action = sudo
#   process.command_line = /usr/bin/security find-generic-password -ga demo-item
# ----------------------------------------------------------------------------
id: b7e5d938-cd9e-59f9-b387-f50f8846f0af
logsource:
  product: process
tags:
  - attack.credential-access
  - attack.t1555
  - attack.t1555.001
falsepositives:
  - Authorised scripts or administrators reading keychain items through sudo
level: high
status: stable
enabled: true
detection:
  condition: selection
  selection:
    event.action: sudo
    process.command_line|contains:
      - find-generic-password
      - find-internet-password
      - dump-keychain
metadata:
  title: DEMO - Keychain secret read via sudo
  author: Demo environment
  description: >
    Detects a sudo-elevated use of the macOS security tool to read, or dump,
    keychain items. Pulling stored credentials as root is a common credential
    access technique on macOS.
  references:
    - https://attack.mitre.org/techniques/T1555/001/
  documentation: ''
  supports:
    - ''
  modified: '2026-10-04'
mitre:
  subtechnique:
    id:
      - T1555.001
    name:
      - Keychain
  tactic:
    id:
      - TA0006
    name:
      - Credential Access
  technique:
    id:
      - T1555
    name:
      - Credentials from Password Stores
---

